name: Maven CI
on:
  push:
    branches: [ dev_CI_1 ]
  pull_request:
    branches: [ dev_CI_1 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile avec Maven
        run: mvn compile

      - name: Tests avec Maven
        run: mvn test

      - name: Packaging
        run: mvn package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app1-jar
          path: target/*.jar
